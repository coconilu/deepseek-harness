# Keyless replay counterpart to the tower-mode SDK recording overlay: the
# tower rows from cordis.yml stay mounted; only the model adapter is replaced
# by replay, whose script derives from the committed session fixture.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
