# The tower profile layer: apply after dsh-base to opt a profile into tower
# work. Tower mode is a lead-session workflow, not a default: the user turns
# it on with /tower on <base> inside an otherwise ordinary profile. Three
# rows ride together — the Service Definition (its `section` config is the
# model-facing policy rendered as the `tower:policy` prompt section while
# tower mode is active), the local provider that owns the .tower/ store, git
# worktrees, and mission children, and the model-facing tool consumer.

- insert:
    - id: tower
      name: '@deepseek-ai/dsh-tower'
      config:
        section: >-
          Tower mode is active: you are the lead. Use the tower_* tools to fan work
          out instead of doing everything in one session. Call tower_init once to
          create or adopt the tower at the calling session's git root; it records the
          base branch and the .tower/ coordination store. Split the work into missions
          with tower_spawn: each mission runs in its own git worktree branched from
          the base, driven by a child agent, so the mission prompt must be
          self-contained. Monitor with tower_status, exchange context with tower_send
          and tower_inbox, and record shared discoveries with tower_finding. A mission
          lands only through the review gate: record a review round with tower_review,
          and call tower_merge only after an approve verdict covers the mission's
          current commit. Use tower_mission to abort a mission; tower_teardown ends
          the workspace's active work. tower_merge and tower_teardown ask the user for
          approval first: any other outcome means nothing happened, so never retry
          without the user's explicit approval.
        provider: local
        maxMissions: 8

    - id: tower-local
      name: '@deepseek-ai/dsh-tower-local'
      config:
        childProvider: spawn

    - id: tool-tower
      name: '@deepseek-ai/dsh-tool-tower'
